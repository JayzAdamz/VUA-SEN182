<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form>
<fieldset>
<legend>Veritas Univerity Orientation Registration</legend>
<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" placeholder="Enter your name"><br><br>
<label for="name"> Matric no:</label>
<input type="text" id="name" name="name"placeholder="Enter your matriculation number"><br><br>


<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Enter your email Address" ><br><br>
<label for="number">Number:</label>
<input type="number" id="number" name="number" placeholder="Enter your number" ><br><br>
<p>Gender:</p>
<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label><br><br>
<p>Documents Submitted:</p>
<input type="checkbox" id="admission" name="docs" value="Admission
Letter">
<label for="admission">Admission Letter</label>
<input type="checkbox" id="receipt" name="docs" value="Payment
Receipt">
<label for="receipt">Payment Receipt</label><br><br>
<label for="date"> Date of Birth:</label>
<input type="date"> <br><br>
<input type="file">
<label for="faculty">Faculty:</label>
<select id="faculty" name="faculty">
<option value="software"> Software Engineering </option>
<option value="Computer">Computing Sciences</option>
<option value="management">Management Sciences</option>
</select><br><br>
<label for="message">Additional Information:</label><br>
<textarea id="message" name="message" rows="4"
cols="40"></textarea><br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</fieldset>
</form>
    
</body>
</html>
